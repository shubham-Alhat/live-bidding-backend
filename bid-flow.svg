<svg width="680" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>BidHub live bidding flow</title>
  <desc>WebSocket bid event enters Node.js, a Redis Lua script atomically validates it, then the result is either broadcast to all clients (accepted) or returned as an error to the bidder only (rejected).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .th  { font-size: 14px; font-weight: 600; fill: #1a1a1a; }
      .ts  { font-size: 12px; font-weight: 400; fill: #555; }

      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th  { fill: #3C3489; }
      .c-purple .ts  { fill: #534AB7; }

      .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th  { fill: #444441; }
      .c-gray .ts  { fill: #5F5E5A; }

      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th  { fill: #085041; }
      .c-teal .ts  { fill: #0F6E56; }

      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber .th  { fill: #633806; }
      .c-amber .ts  { fill: #854F0B; }

      .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
      .c-green .th  { fill: #27500A; }
      .c-green .ts  { fill: #3B6D11; }

      .c-red rect { fill: #FCEBEB; stroke: #A32D2D; }
      .c-red .th  { fill: #791F1F; }
      .c-red .ts  { fill: #A32D2D; }

      .arr { stroke: #888; stroke-width: 1; fill: none; }
    </style>
  </defs>

  <rect width="680" height="640" fill="#ffffff"/>

  <!-- Lane dividers -->
  <line x1="52" y1="140" x2="640" y2="140" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="52" y1="300" x2="640" y2="300" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="52" y1="460" x2="640" y2="460" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>

  <!-- Lane labels -->
  <text class="ts" x="28" y="90"  text-anchor="middle" transform="rotate(-90,28,90)"  opacity="0.45">Clients</text>
  <text class="ts" x="28" y="220" text-anchor="middle" transform="rotate(-90,28,220)" opacity="0.45">App layer</text>
  <text class="ts" x="28" y="380" text-anchor="middle" transform="rotate(-90,28,380)" opacity="0.45">Cache</text>
  <text class="ts" x="28" y="550" text-anchor="middle" transform="rotate(-90,28,550)" opacity="0.45">Outcome</text>

  <!-- Bidder -->
  <g class="c-purple">
    <rect x="60" y="55" width="130" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="77" text-anchor="middle" dominant-baseline="central">Bidder</text>
    <text class="ts" x="125" y="96" text-anchor="middle" dominant-baseline="central">WS: place_bid event</text>
  </g>

  <!-- All clients -->
  <g class="c-gray">
    <rect x="470" y="55" width="150" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="545" y="77" text-anchor="middle" dominant-baseline="central">All clients</text>
    <text class="ts" x="545" y="96" text-anchor="middle" dominant-baseline="central">Connected via WS</text>
  </g>

  <!-- Node.js server -->
  <g class="c-teal">
    <rect x="60" y="162" width="150" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="135" y="184" text-anchor="middle" dominant-baseline="central">Node.js server</text>
    <text class="ts" x="135" y="203" text-anchor="middle" dominant-baseline="central">WS event handler</text>
  </g>

  <!-- Bid valid? -->
  <g class="c-amber">
    <rect x="280" y="162" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="350" y="184" text-anchor="middle" dominant-baseline="central">Bid valid?</text>
    <text class="ts" x="350" y="203" text-anchor="middle" dominant-baseline="central">Result from Redis</text>
  </g>

  <!-- Redis + Lua -->
  <g class="c-amber">
    <rect x="200" y="322" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="285" y="344" text-anchor="middle" dominant-baseline="central">Redis + Lua script</text>
    <text class="ts" x="285" y="363" text-anchor="middle" dominant-baseline="central">Atomic bid validation</text>
  </g>

  <!-- Broadcast -->
  <g class="c-green">
    <rect x="430" y="482" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="520" y="504" text-anchor="middle" dominant-baseline="central">Broadcast to all</text>
    <text class="ts" x="520" y="523" text-anchor="middle" dominant-baseline="central">new_bid WS event</text>
  </g>

  <!-- Reject -->
  <g class="c-red">
    <rect x="60" y="482" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="145" y="504" text-anchor="middle" dominant-baseline="central">Reject to bidder</text>
    <text class="ts" x="145" y="523" text-anchor="middle" dominant-baseline="central">bid_error WS event</text>
  </g>

  <!-- 1. Bidder → Node.js -->
  <line x1="125" y1="111" x2="125" y2="160" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="133" y="138" fill="#555">1️⃣ WS event</text>

  <!-- 2. Node.js → Redis -->
  <path d="M155 218 L155 260 L198 350" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="130" y="272" fill="#555">2️⃣ run Lua script</text>

  <!-- 3. Redis → Decision -->
  <path d="M370 322 L370 220" stroke="#888" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="375" y="278" fill="#555">3️⃣ result</text>

  <!-- 4a. Accepted path -->
  <path d="M420 190 L510 190 L510 480" stroke="#3B6D11" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="468" y="183" fill="#3B6D11">accepted</text>
  <text class="ts" x="470" y="168" fill="#3B6D11">4️⃣𝐀</text>

  <!-- 4b. Rejected path -->
  <path d="M280 200 L230 200 L230 480" stroke="#A32D2D" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="235" y="183" fill="#A32D2D">rejected</text>
  <text class="ts" x="240" y="165" fill="#A32D2D">4️⃣𝐁</text>

  <!-- 5. Broadcast → All clients -->
  <line x1="520" y1="482" x2="530" y2="113" stroke="#3B6D11" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="540" y="300" fill="#3B6D11">5️⃣ broadcast</text>

  <!-- 6. Error → Bidder only -->
  <line x1="145" y1="482" x2="110" y2="113" stroke="#A32D2D" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="50" y="309" fill="#A32D2D">6️⃣ error only</text>
  <text class="ts" x="50" y="325" fill="#A32D2D">send to rejected bidder</text>

</svg>